<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリ一覧 - thivanao</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .app-list { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .app-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: #f5f5f7;
      border-radius: 12px;
      text-decoration: none;
      color: #1d1d1f;
      transition: background 0.15s;
    }
    .app-row:hover { background: #e8e8ed; }
    .app-symbol {
      font-size: 1.6em;
      line-height: 1;
      width: 1.6em;
      text-align: center;
      flex-shrink: 0;
    }
    .app-text { min-width: 0; }
    .app-name { font-weight: 600; }
    .app-tagline { font-size: 0.88em; color: #6e6e73; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .tag {
      border: 1px solid #d2d2d7;
      background: #fff;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85em;
      color: #1d1d1f;
      cursor: pointer;
    }
    .tag[aria-pressed="true"] { background: #007aff; border-color: #007aff; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <nav><a href="index.html">← サポートトップ</a></nav>
    <h1>アプリ一覧</h1>
    <p>thivanao が公開しているアプリの一覧です。カテゴリで絞り込めます。</p>

    <div class="tags" id="tags"></div>
    <div class="app-list" id="list"></div>

    <footer>© 2026 thivanao</footer>
  </div>

  <script>
    const listEl = document.getElementById('list');
    const tagsEl = document.getElementById('tags');
    let catalog = null;
    let activeTag = null;

    function storeUrl(id) {
      return 'https://apps.apple.com/jp/app/id' + id;
    }

    function render() {
      const apps = catalog.apps.filter(a => !activeTag || (a.tags || []).includes(activeTag));
      listEl.innerHTML = '';
      for (const app of apps) {
        const a = document.createElement('a');
        a.className = 'app-row';
        a.href = storeUrl(app.id);
        const symbol = document.createElement('span');
        symbol.className = 'app-symbol';
        symbol.textContent = app.symbol || '📱';
        const text = document.createElement('span');
        text.className = 'app-text';
        const name = document.createElement('div');
        name.className = 'app-name';
        name.textContent = app.name;
        const tagline = document.createElement('div');
        tagline.className = 'app-tagline';
        tagline.textContent = app.tagline || '';
        text.append(name, tagline);
        a.append(symbol, text);
        listEl.append(a);
      }
    }

    function renderTags() {
      const used = new Set();
      catalog.apps.forEach(a => (a.tags || []).forEach(t => used.add(t)));
      for (const tag of used) {
        const b = document.createElement('button');
        b.className = 'tag';
        b.type = 'button';
        b.textContent = (catalog.tagLabels && catalog.tagLabels[tag]) || tag;
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => {
          activeTag = activeTag === tag ? null : tag;
          [...tagsEl.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
          if (activeTag) b.setAttribute('aria-pressed', 'true');
          render();
        });
        tagsEl.append(b);
      }
    }

    fetch('apps.json')
      .then(r => r.json())
      .then(data => {
        catalog = data;
        // 新しいアプリを上に（App Store ID は採番順＝リリース順）
        catalog.apps.sort((a, b) => Number(b.id) - Number(a.id));
        renderTags();
        render();
      })
      .catch(() => {
        listEl.textContent = 'アプリ一覧を読み込めませんでした。';
      });
  </script>
</body>
</html>
